<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" aria-label="Learning journey: AI/ML learning begins, Python and Data Analysis, Machine Learning, Deep Learning, Building projects, Streamlit deployment, B.Sc. IT Semester 5, Continuous learning"><title>Learning journey: AI/ML learning begins, Python and Data Analysis, Machine Learning, Deep Learning, Building projects, Streamlit deployment, B.Sc. IT Semester 5, Continuous learning</title><style>

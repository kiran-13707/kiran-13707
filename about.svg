<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="About: B.Sc. IT student, 3 years of AI/ML learning"><title>About: B.Sc. IT student, 3 years of AI/ML learning</title><style>
text{font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif}
.m{font-family:'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace}
.f{animation:fade .9s ease backwards}
